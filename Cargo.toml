[workspace]
members = [
    "crates/fire2",
    "crates/heat2",
    "crates/protocol",
    "crates/world-core",
    "crates/world",
    "crates/lsx-codec",
    "crates/storage",
    "crates/services",
    "crates/server-support",
    "crates/server",
    "crates/frostbite",
    "crates/content",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
publish = false
license = "MPL-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

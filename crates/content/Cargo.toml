[package]
name = "nfs-content"
version = "0.1.0"
description = "Builds and caches deployment content from a player's own game installation"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Constructed installations for tests of this crate and its users.
synthetic = ["nfs-frostbite/synthetic"]

[dependencies]
nfs-frostbite = { path = "../frostbite" }
nfs-services = { path = "../services" }
nfs-world-core = { path = "../world-core" }
nfs-world = { path = "../world" }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
serde = { version = "=1.0.229", features = ["derive", "rc"] }
sha2 = { version = "=0.11.0", default-features = false }

[dev-dependencies]
nfs-frostbite = { path = "../frostbite", features = ["synthetic"] }

[package]
name = "nfs-afterhours"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Command-line launcher for the Afterhours 2015 local server and the installed game"

[[bin]]
name = "nfs-afterhours"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
nfs-afterhours-sys = { path = "../launcher-sys" }
# Argument parsing, help and usage. Default features are off: no color, no
# suggestions, no environment-variable or wrapping support.
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false }

[package]
name = "nfs-afterhours"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Command-line launcher for the Afterhours 2015 local server and the installed game"

[[bin]]
name = "nfs-afterhours"
path = "src/main.rs"

[lints]
workspace = true

[dev-dependencies]
# The same pinned SQLite as nfs-storage, for tests that hold a second writer.
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "limits"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false }

[dependencies]
anstream = "=1.0.0"
anstyle = "=1.0.14"
nfs-afterhours-sys = { path = "../launcher-sys" }
# Read-only `profile`: the account store and its domain decoders. The
# launcher never opens a store for writing; the server owns all writes.
nfs-services = { path = "../services" }
nfs-storage = { path = "../storage" }
# Item classes and states, to recognize owned cars by the server's own rule.
nfs-world-core = { path = "../world-core" }
# Argument parsing, help and usage. Default features are off: no color, no
# suggestions, no environment-variable or wrapping support.
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
# JSON Schemas of the `--json` records, generated from these types and
# committed under `schema/` for the desktop launcher.
schemars = { version = "=1.2.2", default-features = false, features = ["derive", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false }

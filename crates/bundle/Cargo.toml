[package]
name = "nfs-afterhours-bundle"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Single-executable terminal distribution of Afterhours 2015"

[[bin]]
name = "Afterhours"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
nfs-afterhours = { path = "../launcher" }
nfs-server = { path = "../server" }
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }

[build-dependencies]
embed-resource = "=3.0.12"

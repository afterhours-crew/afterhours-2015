[package]
workspace = "../.."
name = "nfs-services"
version = "0.1.0"
description = "State-owned local control, inventory and persistent-table services"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
story-schema = ["dep:schemars"]

[dependencies]
nfs-fire2 = { path = "../fire2" }
nfs-heat2 = { path = "../heat2" }
nfs-protocol = { path = "../protocol" }
nfs-storage = { path = "../storage" }
nfs-world-core = { path = "../world-core" }
serde_json = "=1.0.151"
serde = { version = "=1.0.229", features = ["derive"] }
schemars = { version = "=1.2.2", default-features = false, features = ["derive", "std"], optional = true }

[package]
workspace = "../.."
name = "nfs-storage"
version = "0.1.0"
description = "NFS 2015 local persistence port: per-account owned inventory with an in-memory adapter and a pinned SQLite adapter (sync, no Tokio)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Defaults off, bundled
# SQLite and runtime limits only. No extension loading, encryption or remote
# database features. The native FFI lives in this dependency; this crate
# forbids unsafe Rust.
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "limits"] }

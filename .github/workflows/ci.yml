name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every main commit keeps its own run: a merged release is tagged only after
# CI passes on its merge commit (tag-release.yml), so none may be cancelled.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        # rustup reads the channel and components from rust-toolchain.toml.
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        # rustup reads the channel and components from rust-toolchain.toml.
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p nfs-server --all-targets --features network-test --locked -- -D warnings

  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo test -p nfs-server --features network-test --locked

  test-windows:
    name: Test (Windows)
    # Windows builds are slow and billed at a higher rate, so they run for
    # pull requests and main only; codex/ checkpoint pushes test on Linux.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo test -p nfs-server --features network-test --locked

  launcher:
    name: Launcher tests (Windows)
    # The launcher's own crates build quickly (no OpenSSL or SQLite), so their
    # Windows tests, including the job-object and process-memory wrappers,
    # run on every push rather than only on pull requests.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: launcher
      - run: cargo test -p nfs-afterhours -p nfs-afterhours-sys --locked

  release-scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Offline tests
        shell: pwsh
        run: |
          ./tools/Test-Release.ps1
          ./tools/Test-TerminalDraft.ps1
      # A dry run of Prepare release on the base branch: the notes the next
      # release would start with. Nothing is committed or pushed.
      - name: Draft the next release's notes
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ./tools/Prepare-Release.ps1 -Repository $env:GH_REPO -BodyFile "$env:RUNNER_TEMP/release-pr.md" -Head HEAD^1 -Preview
          Get-Content -LiteralPath "$env:RUNNER_TEMP/release-pr.md" -Raw | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

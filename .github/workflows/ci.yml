name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        # rustup reads the channel and components from rust-toolchain.toml.
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        # rustup reads the channel and components from rust-toolchain.toml.
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    # Windows builds are slow and billed at a higher rate, so they run for
    # pull requests and main only; codex/ checkpoint pushes test on Linux.
    if: matrix.os != 'windows-latest' || github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        # rustup reads the channel and components from rust-toolchain.toml.
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  launcher:
    name: Launcher checks (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell version
        shell: pwsh
        run: $PSVersionTable.PSVersion
      - name: Launcher tests
        shell: pwsh
        run: ./launcher/Test-Launcher.ps1
      # Test-Session.ps1 refuses elevated sessions by design and GitHub-hosted
      # Windows runners are always elevated, so it stays a local developer check.

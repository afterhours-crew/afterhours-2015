name: Windows tester bundle

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - tools/Package-TerminalBundle.ps1
      - crates/bundle/**
      - docs/TESTER-QUICKSTART.md

permissions:
  contents: read

concurrency:
  group: terminal-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      AFTERHOURS_RELEASE: ${{ github.event.release.tag_name || 'development' }}
      AFTERHOURS_REVISION: ${{ github.sha }}
      # Keep release staging outside target/, which rust-cache restores.
      AFTERHOURS_PACKAGE_DIR: ${{ runner.temp }}/afterhours-release-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A published release builds its tag, never a moving default branch.
          ref: ${{ github.event.release.tag_name || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup target add x86_64-pc-windows-msvc
          rustup show active-toolchain
          Get-Command perl
      - uses: Swatinem/rust-cache@v2
        with:
          key: terminal-release
      - name: Check the tagged source
        # Pull requests already run all three workspace gates in ci.yml.
        if: github.event_name != 'pull_request'
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build standalone Windows executable
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
        run: |
          $env:AFTERHOURS_REVISION = (git rev-parse HEAD).Trim()
          cargo build --release --target x86_64-pc-windows-msvc -p nfs-afterhours-bundle --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and smoke-test
        run: ./tools/Package-TerminalBundle.ps1 -Executable target/x86_64-pc-windows-msvc/release/Afterhours.exe -OutputDirectory $env:AFTERHOURS_PACKAGE_DIR -Release $env:AFTERHOURS_RELEASE
      - uses: actions/upload-artifact@v4
        with:
          name: afterhours-windows-x64
          path: |
            ${{ env.AFTERHOURS_PACKAGE_DIR }}/Afterhours-windows-x64.zip
            ${{ env.AFTERHOURS_PACKAGE_DIR }}/SHA256SUMS.txt
            ${{ env.AFTERHOURS_PACKAGE_DIR }}/build-info.json
          if-no-files-found: error
      - name: Attach bundle to the published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = @('Afterhours-windows-x64.zip', 'SHA256SUMS.txt', 'build-info.json') |
            ForEach-Object { Join-Path $env:AFTERHOURS_PACKAGE_DIR $_ }
          gh release upload "$env:AFTERHOURS_RELEASE" @assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
